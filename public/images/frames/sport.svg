<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <defs>
    <!-- Fire Mirror / Polarized Iridescent Gradient -->
    <linearGradient id="fireMirror" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="matteCarbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Left Wrap Lens & Half Rim -->
  <g id="left-sport">
    <path d="M 65 65 C 130 55, 230 60, 275 75 C 275 110, 260 165, 220 185 C 160 205, 95 180, 60 140 C 45 110, 50 80, 65 65 Z" fill="url(#fireMirror)" />
    <!-- White Glare Streak across aerodynamic lens -->
    <path d="M 75 70 C 130 62, 220 66, 265 80 L 255 92 C 215 80, 130 76, 80 84 Z" fill="#FFFFFF" fill-opacity="0.35" />
    <!-- Upper Wrap Brow Frame -->
    <path d="M 45 75 C 55 52, 140 44, 278 68" stroke="url(#matteCarbon)" stroke-width="15" stroke-linecap="round" />
  </g>

  <!-- Right Wrap Lens & Half Rim -->
  <g id="right-sport">
    <path d="M 535 65 C 470 55, 370 60, 325 75 C 325 110, 340 165, 380 185 C 440 205, 505 180, 540 140 C 555 110, 550 80, 535 65 Z" fill="url(#fireMirror)" />
    <!-- White Glare Streak across aerodynamic lens -->
    <path d="M 525 70 C 470 62, 380 66, 335 80 L 345 92 C 385 80, 470 76, 520 84 Z" fill="#FFFFFF" fill-opacity="0.35" />
    <!-- Upper Wrap Brow Frame -->
    <path d="M 555 75 C 545 52, 460 44, 322 68" stroke="url(#matteCarbon)" stroke-width="15" stroke-linecap="round" />
  </g>

  <!-- Center Ergonomic Brow Bridge -->
  <path d="M 270 70 C 290 62, 310 62, 330 70" stroke="url(#matteCarbon)" stroke-width="18" stroke-linecap="round" />

  <!-- Integrated Rubberized Nose Pad -->
  <path d="M 278 95 C 290 85, 310 85, 322 95 L 315 115 C 305 110, 295 110, 285 115 Z" fill="#334155" opacity="0.9" />

  <!-- Wrap-Around Aerodynamic Arms / Temples -->
  <path d="M 45 75 L 15 82 L 5 95" stroke="url(#matteCarbon)" stroke-width="16" stroke-linecap="round" />
  <path d="M 555 75 L 585 82 L 595 95" stroke="url(#matteCarbon)" stroke-width="16" stroke-linecap="round" />
</svg>
