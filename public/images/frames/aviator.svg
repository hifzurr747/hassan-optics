<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <defs>
    <!-- Polarized Gradient Lens Tint -->
    <linearGradient id="aviatorLensGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#243862" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#334E84" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="aviatorGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <!-- Subtle glare reflection -->
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Lens & Rim -->
  <g id="left-eye">
    <!-- Lens glass -->
    <path d="M 85 50 C 130 45, 230 45, 260 55 C 275 80, 275 135, 235 185 C 190 215, 120 200, 80 155 C 65 110, 65 75, 85 50 Z" fill="url(#aviatorLensGrad)" />
    <!-- Glare reflection -->
    <path d="M 85 50 C 130 45, 230 45, 260 55 C 240 70, 160 80, 95 110 C 75 90, 75 65, 85 50 Z" fill="url(#glare)" />
    <!-- Outer Metal Rim -->
    <path d="M 85 50 C 130 45, 230 45, 260 55 C 275 80, 275 135, 235 185 C 190 215, 120 200, 80 155 C 65 110, 65 75, 85 50 Z" stroke="url(#aviatorGold)" stroke-width="6" stroke-linejoin="round" />
    <path d="M 85 50 C 130 45, 230 45, 260 55 C 275 80, 275 135, 235 185 C 190 215, 120 200, 80 155 C 65 110, 65 75, 85 50 Z" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- Right Lens & Rim -->
  <g id="right-eye">
    <!-- Lens glass -->
    <path d="M 515 50 C 470 45, 370 45, 340 55 C 325 80, 325 135, 365 185 C 410 215, 480 200, 520 155 C 535 110, 535 75, 515 50 Z" fill="url(#aviatorLensGrad)" />
    <!-- Glare reflection -->
    <path d="M 515 50 C 470 45, 370 45, 340 55 C 360 70, 440 80, 505 110 C 525 90, 525 65, 515 50 Z" fill="url(#glare)" />
    <!-- Outer Metal Rim -->
    <path d="M 515 50 C 470 45, 370 45, 340 55 C 325 80, 325 135, 365 185 C 410 215, 480 200, 520 155 C 535 110, 535 75, 515 50 Z" stroke="url(#aviatorGold)" stroke-width="6" stroke-linejoin="round" />
    <path d="M 515 50 C 470 45, 370 45, 340 55 C 325 80, 325 135, 365 185 C 410 215, 480 200, 520 155 C 535 110, 535 75, 515 50 Z" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- Double Aviator Bridge -->
  <!-- Top sweat bar -->
  <path d="M 230 46 C 265 42, 335 42, 370 46" stroke="url(#aviatorGold)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 230 46 C 265 42, 335 42, 370 46" stroke="#111111" stroke-width="1" />
  <!-- Lower arched bridge -->
  <path d="M 255 75 C 275 60, 325 60, 345 75" stroke="url(#aviatorGold)" stroke-width="5" stroke-linecap="round" />
  <path d="M 255 75 C 275 60, 325 60, 345 75" stroke="#111111" stroke-width="1" />

  <!-- Nose Pads -->
  <ellipse cx="270" cy="98" rx="4" ry="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" opacity="0.8" />
  <ellipse cx="330" cy="98" rx="4" ry="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" opacity="0.8" />

  <!-- Outer Temples / Hinges -->
  <!-- Left Hinge -->
  <path d="M 68 85 L 30 80 L 15 88" stroke="url(#aviatorGold)" stroke-width="5" stroke-linecap="round" />
  <!-- Right Hinge -->
  <path d="M 532 85 L 570 80 L 585 88" stroke="url(#aviatorGold)" stroke-width="5" stroke-linecap="round" />
</svg>
